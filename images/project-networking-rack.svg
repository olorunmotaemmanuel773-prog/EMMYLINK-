    <!-- U4: Cable Brush Management Tray -->
    <g transform="translate(40, 275)">
      <rect x="0" y="0" width="620" height="35" rx="4" fill="#24211E" stroke="#4A443D"/>
      <line x1="20" y1="17" x2="600" y2="17" stroke="#141210" stroke-width="12" stroke-linecap="round"/>
      <path d="M50,0 Q60,35 70,35" stroke="#C47A44" stroke-width="4" fill="none"/>
      <path d="M120,0 Q130,35 140,35" stroke="#C47A44" stroke-width="4" fill="none"/>
      <path d="M200,0 Q210,35 220,35" stroke="#C47A44" stroke-width="4" fill="none"/>
      <path d="M300,0 Q310,35 320,35" stroke="#C47A44" stroke-width="4" fill="none"/>
      <path d="M400,0 Q410,35 420,35" stroke="#C47A44" stroke-width="4" fill="none"/>
    </g>

    <!-- U5: Wi-Fi 6 Controller & Router Gateway -->
    <g transform="translate(40, 320)">
      <rect x="0" y="0" width="620" height="55" rx="4" fill="#2C2925" stroke="#C47A44" stroke-width="1"/>
      <text x="15" y="25" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">WI-FI 6 MESH GATEWAY &amp; FIREWALL</text>
