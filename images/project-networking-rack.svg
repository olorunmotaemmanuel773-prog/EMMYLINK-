  <rect x="60" y="640" width="880" height="40" rx="6" fill="#1C1A18" stroke="#C47A44" stroke-width="1"/>
  <text x="80" y="665" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">STRUCTURED NETWORKING, FIBER OPTICS &amp; LOW-VOLTAGE INFRASTRUCTURE</text>
  <text x="730" y="665" fill="#D6A85F" font-family="monospace" font-size="11">COMMISSIONED BY EMMYLINK</text>
</svg>