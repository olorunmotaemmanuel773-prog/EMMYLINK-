    <g transform="translate(40, 390)">
      <rect x="0" y="0" width="620" height="75" rx="4" fill="#0D0D0D" stroke="#4A443D" stroke-width="1.5"/>
      <text x="20" y="28" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">ONLINE DOUBLE-CONVERSION UPS 1500VA</text>
      <text x="20" y="50" fill="#10B981" font-family="monospace" font-size="10">BATTERY 100% • 0ms TRANSFER TIME • CLEAN SINE WAVE</text>
      <rect x="450" y="20" width="140" height="35" rx="4" fill="#1C1A18" stroke="#C47A44"/>
      <text x="465" y="42" fill="#D6A85F" font-family="monospace" font-size="11" font-weight="bold">230V / 50Hz</text>
    </g>

    <!-- Bottom Rack pass-through -->
    <g transform="translate(40, 480)">
      <rect x="0" y="0" width="620" height="40" rx="6" fill="#141210" stroke="#2C2925"/>
      <text x="20" y="25" fill="#D8D1C7" font-family="'Inter', sans-serif" font-size="11">STRUCTURED CABLING • ISO/IEC 11801 COMPLIANT • TESTED WITH FLUKE NETWORKS</text>
    </g>
