<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon Emblem -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="90" height="90" rx="20" fill="#0B132B" stroke="url(#logoGrad)" stroke-width="2.5"/>
    <!-- Tech Circuit Grid Lines -->
    <path d="M15,45 L32,45 M58,45 L75,45 M45,15 L45,30 M45,60 L45,75" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="45" r="3" fill="#38BDF8"/>
    <circle cx="75" cy="45" r="3" fill="#38BDF8"/>
    <circle cx="45" cy="15" r="3" fill="#38BDF8"/>
    <circle cx="45" cy="75" r="3" fill="#38BDF8"/>
    <!-- Central Lightning & Smart Node Link -->
    <path d="M50,22 L30,48 L44,48 L38,68 L60,40 L46,40 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
    <!-- Connection Dots -->
    <circle cx="30" cy="48" r="2" fill="#FFFFFF"/>
    <circle cx="60" cy="40" r="2" fill="#FFFFFF"/>
  </g>
  <!-- Brand Typography -->
  <text x="120" y="62" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="900" letter-spacing="2.5" fill="#FFFFFF">EMMY<tspan fill="url(#logoGrad)">LINK</tspan></text>
  <text x="122" y="88" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="5.5" fill="#38BDF8">ELECTRICAL &amp; AUTOMATION</text>
  <!-- Tech Accent Indicator -->
  <circle cx="460" cy="52" r="4" fill="#00E5FF" filter="url(#glow)"/>
</svg>